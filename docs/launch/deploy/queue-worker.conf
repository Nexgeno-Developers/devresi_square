; Supervisor program for the ResiSquare queue.
; tries 3, timeout 120 seconds. After every deploy run: php artisan queue:restart
[program:resisquare-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/resisquare/artisan queue:work database --sleep=3 --tries=3 --timeout=120
autostart=true
autorestart=true
stopwaitsecs=130
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/resisquare-queue.log
